[project]
name = "gs-dft"
version = "0.1.0"
description = "Scaling Density Functional Theory with Gaussian Splatting: Kohn-Sham DFT in a trainable basis of floating anisotropic Gaussians, in JAX."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Andrés Guzmán-Cordero", email = "andres.guzman-cordero@mila.quebec" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dftax>=0.8",
    "equinox>=0.13.2",
    "hydra-core>=1.3",                           # experiment configuration (conf/)
    "jax>=0.10.0; sys_platform == 'darwin'",
    "jax[cuda12]>=0.10.0; sys_platform == 'linux'",
    "jaxtyping>=0.2.0",
    "numpy>=1.26",
    "optax>=0.2.6",
    "periodictable>=2.0",                        # covalent radii for basis/chem.py
    "scipy>=1.11",                               # cKDTree in screening and the chemistry init
    "wandb>=0.28.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/andresguzco/gs-dft"
Issues = "https://github.com/andresguzco/gs-dft/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
# External reference engines, for the alanine dipeptide force references and the coupled-cluster densities.
external = ["pyscf>=2.6", "gpu4pyscf-cuda12x>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_dft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::FutureWarning:jax",
]
addopts = ["-ra", "--strict-markers", "--tb=short"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "tueplots>=0.0.14",
]
